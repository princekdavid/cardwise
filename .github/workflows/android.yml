name: Android CI

on:
  push:
    branches: [ main, "foundation/**", "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - run: gradle testDebugUnitTest
      - run: gradle assembleDebug

  instrumentation:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Enable KVM for Android emulator
        run: |
          sudo groupadd -f kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 256M
          disk-size: 6000M
          working-directory: android
          avd-name: test
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          disable-linux-hw-accel: false
          script: |
            bash -c 'set -o pipefail; mkdir -p "$GITHUB_WORKSPACE/ui-screenshots"; gradle assembleDebug assembleDebugAndroidTest --no-daemon; cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ui-screenshots/cardwise-debug.apk"; gradle installDebug --no-daemon; adb -s emulator-5554 shell pm path com.cardwise.app; adb -s emulator-5554 shell cmd package resolve-activity --brief com.cardwise.app; adb -s emulator-5554 shell am force-stop com.cardwise.app; adb -s emulator-5554 shell monkey -p com.cardwise.app -c android.intent.category.LAUNCHER 1; sleep 5; adb -s emulator-5554 exec-out screencap -p > "$GITHUB_WORKSPACE/ui-screenshots/00-main-activity.png"; adb -s emulator-5554 shell "dumpsys activity activities | grep -m1 mResumedActivity" | tee "$GITHUB_WORKSPACE/ui-screenshots/00-main-activity.txt" || true; adb -s emulator-5554 shell "screenrecord --time-limit 120 /sdcard/cardwise-instrumentation.mp4" >/dev/null 2>&1 & record_pid=$!; gradle connectedDebugAndroidTest --no-daemon 2>&1 | tee instrumentation.log; test_status=${PIPESTATUS[0]}; wait "$record_pid" || true; adb -s emulator-5554 pull /sdcard/cardwise-instrumentation.mp4 "$GITHUB_WORKSPACE/ui-screenshots/cardwise-instrumentation.mp4" || true; adb -s emulator-5554 shell "find /data/local/tmp -maxdepth 1 -type f -name \"cardwise-*.png\" -print" || true; for screenshot in 01-wallet-empty 02-card-form-filled 03-card-saved 04-scan-screen 05-scanned-payment 06-category-entered 07-recommendation-failure 07-recommendation-ready 08-handoff-dialog 09-after-handoff; do adb -s emulator-5554 pull "/data/local/tmp/cardwise-$screenshot.png" "$GITHUB_WORKSPACE/ui-screenshots/$screenshot.png" || true; done; adb -s emulator-5554 exec-out screencap -p > "$GITHUB_WORKSPACE/ui-screenshots/99-final-screen.png" || true; if grep -Eq "Starting 0 tests|Finished 0 tests" instrumentation.log; then echo "ERROR: instrumentation completed without executing any Android tests."; test_status=1; fi; exit "$test_status"'
      - name: Upload UI diagnostics and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardwise-ui-diagnostics
          path: |
            ui-screenshots/*.apk
            ui-screenshots/*.png
            ui-screenshots/*.mp4
            ui-screenshots/*.txt
          if-no-files-found: error
          retention-days: 7
