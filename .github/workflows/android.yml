name: Android CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "feature/**"
      - "foundation/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - run: gradle testDebugUnitTest
      - run: gradle assembleDebug
      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cardwise-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  instrumentation:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Enable KVM for Android emulator
        run: |
          sudo groupadd -f kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 256M
          disk-size: 6000M
          working-directory: android
          avd-name: test
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          disable-linux-hw-accel: false
          script: |
            gradle connectedDebugAndroidTest --no-daemon > instrumentation.log 2>&1 || status=$?
            status=${status:-0}
            cat instrumentation.log
            if grep -Eq 'Starting 0 tests|Finished 0 tests' instrumentation.log; then
              echo 'ERROR: instrumentation completed without executing any Android tests.'
              exit 1
            fi
            mkdir -p ../cardwise-ui-evidence
            echo 'Collecting screenshot evidence from app-private storage via adb run-as...'
            for name in 01-recommendation 02-payment-handoff 03-after-handoff-return; do
              adb shell "run-as com.cardwise.app test -f files/cardwise-evidence/$name.png"
              adb exec-out "run-as com.cardwise.app cat files/cardwise-evidence/$name.png" > "../cardwise-ui-evidence/$name.png"
            done
            ls -lh ../cardwise-ui-evidence
            test -s ../cardwise-ui-evidence/01-recommendation.png
            test -s ../cardwise-ui-evidence/02-payment-handoff.png
            test -s ../cardwise-ui-evidence/03-after-handoff-return.png
            file ../cardwise-ui-evidence/*.png
            exit "$status"
      - name: Publish UI screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardwise-ui-screenshot-evidence
          path: cardwise-ui-evidence/
          if-no-files-found: error
          retention-days: 14
