name: Android CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "feature/**"
      - "foundation/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - run: gradle testDebugUnitTest
      - run: gradle assembleDebug
      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cardwise-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  instrumentation:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Enable KVM for Android emulator
        run: |
          sudo groupadd -f kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 256M
          disk-size: 6000M
          working-directory: android
          avd-name: test
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          disable-linux-hw-accel: false
          script: |
            gradle connectedDebugAndroidTest --no-daemon > instrumentation.log 2>&1 || status=$?
            status=${status:-0}
            cat instrumentation.log
            grep -Eq 'Starting 0 tests|Finished 0 tests' instrumentation.log && { echo 'ERROR: instrumentation completed without executing any Android tests.'; exit 1; } || true
            mkdir -p ../cardwise-ui-evidence
            echo 'Collecting UI screenshot evidence from the installed CardWise app...'
            apk_path=$(find . -type f -path '*/build/outputs/apk/debug/*.apk' -print | sort | head -n 1)
            test -n "$apk_path"
            test -s "$apk_path"
            echo "Built debug APK: $apk_path"
            build_tools_version=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
            aapt="$build_tools_version/aapt"
            test -x "$aapt"
            application_id=$("$aapt" dump badging "$apk_path" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)
            test -n "$application_id"
            echo "Application ID from built APK: $application_id"
            installed_apk=$(adb shell pm path "$application_id" | tr -d '\r')
            test -n "$installed_apk"
            echo "Installed APK: $installed_apk"
            adb shell "run-as $application_id test -s files/cardwise-evidence/01-recommendation.png"
            adb exec-out "run-as $application_id cat files/cardwise-evidence/01-recommendation.png" > ../cardwise-ui-evidence/01-recommendation.png
            adb shell "run-as $application_id test -s files/cardwise-evidence/02-payment-handoff.png"
            adb exec-out "run-as $application_id cat files/cardwise-evidence/02-payment-handoff.png" > ../cardwise-ui-evidence/02-payment-handoff.png
            adb shell "run-as $application_id test -s files/cardwise-evidence/03-after-handoff-return.png"
            adb exec-out "run-as $application_id cat files/cardwise-evidence/03-after-handoff-return.png" > ../cardwise-ui-evidence/03-after-handoff-return.png
            ls -lh ../cardwise-ui-evidence
            test -s ../cardwise-ui-evidence/01-recommendation.png
            test -s ../cardwise-ui-evidence/02-payment-handoff.png
            test -s ../cardwise-ui-evidence/03-after-handoff-return.png
            file ../cardwise-ui-evidence/*.png
            exit "$status"
      - name: Publish UI screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardwise-ui-screenshot-evidence
          path: cardwise-ui-evidence/
          if-no-files-found: error
          retention-days: 14
