name: Android CI

on:
  push:
    branches: [ main, "foundation/**", "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - run: gradle testDebugUnitTest
      - run: gradle assembleDebug

  instrumentation:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Enable KVM for Android emulator
        run: |
          sudo groupadd -f kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 256M
          disk-size: 6000M
          working-directory: android
          avd-name: test
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          disable-linux-hw-accel: false
          script: |
            set +e
            set -o pipefail
            gradle connectedDebugAndroidTest --no-daemon 2>&1 | tee instrumentation.log
            test_status=${PIPESTATUS[0]}
            mkdir -p "$GITHUB_WORKSPACE/ui-screenshots"
            adb -s emulator-5554 pull /sdcard/Android/data/com.cardwise.app.test/files/ui-screenshots "$GITHUB_WORKSPACE/ui-screenshots" || true
            if grep -Eq "Starting 0 tests|Finished 0 tests" instrumentation.log; then
              echo "ERROR: instrumentation completed without executing any Android tests."
              test_status=1
            fi
            exit "$test_status"
      - name: Upload UI diagnostic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardwise-ui-diagnostic-screenshots
          path: ui-screenshots/**/*.png
          if-no-files-found: ignore
          retention-days: 7
