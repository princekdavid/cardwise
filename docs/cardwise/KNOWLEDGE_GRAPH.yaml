schema_version: 1
project:
  id: CARDWISE
  name: CardWise
  platform: Android
  stack: Kotlin + Jetpack Compose + Material Design
  architecture: Presentation -> ViewModel/UI State -> Domain -> Repository -> Data
  promise: "Before I pay, CardWise tells me the smartest way to pay."
  working_branch: feat/design-system-prototype-integration
  implementation_baseline: "Historical branch baseline before memory commits: 1aa3343eca479be70be04e579b563e1bb6b3cb54"

status_vocabulary: [DISCOVERED, PLANNED, DESIGNED, IN_PROGRESS, PARTIAL, IMPLEMENTED, VERIFIED, BLOCKED, DEFERRED, REJECTED, OBSOLETE, NEEDS_VERIFICATION]

source_of_truth:
  - {id: CODE, priority: 1, source: "Current repository code and tests"}
  - {id: DESIGN, priority: 2, source: "CardWise Interactive Experience Prototype.html; CardWise Jetpack Compose Android Application.kt.txt", latest_known: 2026-09-07}
  - {id: MEMORY, priority: 3, source: "docs/cardwise/*"}
  - {id: HISTORICAL_DOCS, priority: 4, source: "docs/PRODUCT_SPEC.md, docs/ARCHITECTURE.md, docs/ROADMAP.md, docs/STATUS.md, docs/UX_SYSTEM.md"}
  - {id: CONFLICT_RULE, priority: 0, source: "Never guess when sources conflict; record and resolve the discrepancy."}

constraints:
  - {id: C-001, severity: critical, status: VERIFIED, rule: "Existing APK launcher logo must remain exactly as-is; never redesign, recolor, replace or reinterpret it."}
  - {id: C-002, severity: critical, status: VERIFIED, rule: "Never store UPI PINs, banking passwords, PAN/CVV or equivalent payment credentials."}
  - {id: C-003, severity: critical, status: IMPLEMENTED, rule: "Treat QR contents as untrusted and keep payment payload handling local/ephemeral where practical."}
  - {id: C-004, severity: critical, status: IMPLEMENTED, rule: "External payment handoff requires explicit user confirmation."}
  - {id: C-005, severity: high, status: IMPLEMENTED, rule: "Business rules stay outside Compose UI."}
  - {id: C-006, severity: high, status: IMPLEMENTED, rule: "Recommendation ranking is deterministic and explainable."}
  - {id: C-007, severity: high, status: IN_PROGRESS, rule: "Dynamic card, merchant and offer data must be provider/engine backed; prototype data is not production truth."}
  - {id: C-008, severity: high, status: ACTIVE, rule: "IMPLEMENTED and VERIFIED are separate states and require separate evidence."}

features:
  F-001:
    name: Card Wallet
    status: VERIFIED
    should_do: "Let users add, edit, activate/pause, inspect and remove cards and configured benefits."
    done: [card_model_validation, Room_persistence, repository_boundary, list_add_edit_delete_detail, benefit_overview, loading_empty_error_states]
    next: "Reconcile physical-card/deck presentation and verify all interactions on the current APK."
  F-002:
    name: Rewards & Benefit Intelligence
    status: VERIFIED
    should_do: "Represent and calculate rewards/benefits using deterministic rules, categories, caps and thresholds."
    done: [reward_rules, deterministic_calculation, benefit_tracking, expiry_reminder_policy, persisted_rules, edge_case_tests]
    next: "Keep calculation independent and evolve through composable engine contracts."
  F-003:
    name: Recommendation
    status: VERIFIED
    should_do: "Given a transaction and eligible payment options, select the best expected value and explain why."
    done: [payment_context, eligibility_validation, deterministic_ranking, explainable_result, ViewModel_state_flow_UI, persisted_rule_integration, tests]
    next: "Reconcile Reasoning/Recommendation prototype presentation and expand ranking inputs through explicit engines."
  F-004:
    name: QR Scan
    status: VERIFIED
    should_do: "Scan supported UPI QR codes, parse locally and recover safely from invalid/unsupported/repeated scans."
    done: [CameraX_MLKit, permission_UX, local_UPI_parser, invalid_handling, duplicate_protection, lifecycle_hardening]
    next: "APK/device validation across all scanner states."
  F-005:
    name: Scan & Pay
    status: VERIFIED
    should_do: "Convert a supported scan into a recommendation and safely hand off to an external UPI app after confirmation."
    done: [scan_prefill, sanitized_UPI_URI, explicit_confirmation, safe_launcher, lifecycle_return, instrumentation]
    next: "Validate current APK and reconcile post-handoff/error states with the latest reference."
  F-006:
    name: Cockpit
    status: PARTIAL
    should_do: "Provide premium home surface with payment intelligence, deck status, useful metrics and a fast Scan action."
    reference_requirements: [airy_layout, category_coding, fast_scan, card_reward_context, theme_awareness]
    next: "Screen-by-screen visual and interaction reconciliation."
  F-007:
    name: My Deck / Wallet presentation
    status: PARTIAL
    should_do: "Present enrolled physical cards as a tactile, manageable deck while preserving Room/repository behavior."
    reference_requirements: [physical_card_spotlight, math_provenance, detail_bottom_sheet, active_paused, edit_remove]
    next: "Reconcile prototype deck behavior without replacing production architecture."
  F-008:
    name: Card Catalog
    status: PARTIAL
    should_do: "Discover supported cards and add relevant cards to the deck."
    reference_requirements: [search, filters, category_discovery, provider_backed_data]
    next: "Define catalog provider/data contract and complete UI reconciliation."
  F-009:
    name: Offers
    status: PARTIAL
    should_do: "Surface active relevant offers and determine whether they apply to cards, merchants and transactions."
    reference_requirements: [active_offers, applicability, expiry, provenance]
    next: "Define Offer Engine and provider-backed offer data before expanding UI."
  F-010:
    name: Insights / Milestones
    status: DESIGNED
    should_do: "Explain historical savings, rewards, spend patterns and progress."
    next: "Confirm exact scope/data contract from approved reference before implementation."
  F-011:
    name: Privacy Vault / Settings
    status: DESIGNED
    should_do: "Give transparency and control over locally stored CardWise data, privacy behavior and reset."
    next: "Reconcile with reference and security model."
  F-012:
    name: Onboarding
    status: DESIGNED
    should_do: "Explain product promise/privacy and establish initial setup before Cockpit."
    reference_requirements: [privacy_oath, theme_entry, explicit_consent]
    next: "Verify current production onboarding and implement only after reconciliation."
  F-013:
    name: Theme System
    status: IMPLEMENTED
    should_do: "Provide theme-aware rendering using shared design tokens."
    reference_requirements: [Obsidian_Dark, Pearl_Bright, shared_spacing, shared_motion]
    next: "Verify all new screens use the same tokens and accessibility contrast."

engines:
  design_rule: "Feature = user capability. Engine = reusable business responsibility. Add/split engines only when cohesive responsibility, independent tests, evolving rules or distinct data providers justify separation."
  registry:
    ENG-001:
      name: QR / Payment Context Resolver
      status: IMPLEMENTED
      should_do: "Normalize supported QR/UPI input into safe PaymentContext."
      inputs: [qr_payload]
      outputs: [payment_context, validation_result]
      must: [validate_untrusted_input, keep_sensitive_credentials_out, keep_raw_payload_ephemeral]
      must_not: [authorize_payment, choose_best_card, store_UPI_PIN]
    ENG-002:
      name: Reward Engine
      status: IMPLEMENTED_AS_DOMAIN_LOGIC
      should_do: "Calculate expected card reward/benefit deterministically."
      inputs: [payment_context, card, reward_rules]
      outputs: [reward_estimate, provenance]
      must: [deterministic, cap_threshold_handling, numeric_safety]
      future_extensions: [cashback, points, miles, category_multipliers, spend_thresholds]
    ENG-003:
      name: Recommendation Engine
      status: IMPLEMENTED
      should_do: "Evaluate eligible options, calculate expected value, rank deterministically and produce reasoning."
      inputs: [payment_context, wallet, reward_rules, offers, eligibility_constraints]
      outputs: [ranked_candidates, selected_candidate, benefit_calculation, reasoning, caveats]
      pipeline: [normalize_context, eligibility, apply_rules, calculate, rank, explain]
      must_not: [launch_payment_app, mutate_wallet, depend_on_UI_state, claim_unverified_savings]
      future_extensions: [offer_weighting, merchant_rules, user_preferences, travel_value, subscription_detection]
    ENG-004:
      name: Eligibility Engine
      status: IMPLEMENTED_WITHIN_RECOMMENDATION
      should_do: "Determine whether a card/rule/offer/payment method applies and explain ineligibility."
      future_extensions: [merchant_restrictions, network_restrictions, category_restrictions, spend_limits]
    ENG-005:
      name: Offer Engine
      status: PLANNED
      should_do: "Discover, normalize, filter and explain applicable promotions without hard-coding offers in UI."
      inputs: [merchant, payment_context, wallet, offer_catalog, time]
      outputs: [applicable_offers, benefit_estimates, eligibility_reason, provenance]
      must: [provider_backed, expiry_tracking, uncertainty_handling, card_merchant_network_matching]
      future_providers: [issuer, network, merchant, partner]
    ENG-006:
      name: Merchant Intelligence Engine
      status: PROPOSED
      should_do: "Resolve/enrich merchant identity and context when reliable data is available."
      possible_inputs: [PaymentContext, MCC, VPA_hints, merchant_sources]
      possible_outputs: [merchant_identity, category, confidence]
    ENG-007:
      name: Insights Engine
      status: PROPOSED
      should_do: "Aggregate transaction/reward history into explainable savings, spend and milestone insights."
      possible_outputs: [savings_metrics, trends, reward_summaries, benefit_utilization, milestones]
  engine_admission_rule: "Do not create an engine just for abstraction. Create one when the responsibility needs independent rules, testing, a data/provider boundary or independent evolution."

screens:
  conceptual_reference_set: [ONBOARDING, COCKPIT, SCAN, REASONING, RECOMMENDATION, HANDOFF, WALLET, CATALOG, OFFERS, INSIGHTS, VAULT]
  S-001: {name: Onboarding, status: DESIGNED}
  S-002: {name: Cockpit, status: PARTIAL}
  S-003: {name: QR Scan, status: IMPLEMENTED}
  S-004: {name: Reasoning, status: DESIGNED}
  S-005: {name: Recommendation, status: IMPLEMENTED}
  S-006: {name: Payment Handoff, status: IMPLEMENTED}
  S-007: {name: Wallet / My Deck, status: PARTIAL}
  S-008: {name: Card Catalog, status: PARTIAL}
  S-009: {name: Offers, status: PARTIAL}
  S-010: {name: Insights / Milestones, status: DESIGNED}
  S-011: {name: Privacy Vault, status: DESIGNED}

flows:
  FLOW-001: {name: Onboarding, path: [ONBOARDING, COCKPIT], status: NEEDS_VERIFICATION}
  FLOW-002:
    name: Scan to recommendation to payment
    path: [SCAN, REASONING, RECOMMENDATION, HANDOFF, EXTERNAL_UPI_APP, RETURN]
    status: PARTIAL
    states: [permission, valid_upi, invalid_qr, non_upi_qr, missing_amount, loading, ready, confirmation, no_handler, return]
    known_gap: "Full UI instrumentation path is intentionally deferred until the current UI is fully validated against the APK/reference."
  FLOW-003: {name: Wallet management, path: [WALLET, CARD_DETAIL, ADD_EDIT, DELETE], status: VERIFIED}
  FLOW-004: {name: Catalog discovery, path: [WALLET, CATALOG, FILTER, CARD_DETAIL, ADD], status: PARTIAL}
  FLOW-005: {name: Offers discovery, path: [OFFERS, OFFER_DETAIL, CARD_OR_MERCHANT_CONTEXT], status: DESIGNED}
  FLOW-006: {name: Privacy reset, path: [VAULT, RESET_CONFIRMATION, ONBOARDING], status: DESIGNED}

verification:
  historical_milestones: {M0: VERIFIED, M1: VERIFIED, M2: VERIFIED, M3: VERIFIED, M4: VERIFIED, M5: VERIFIED, M6: VERIFIED, M7: PARTIAL}
  latest_historical_m6_commit: 7591de9ae4a25ee03e6a4448f13a54f15b43884f
  current_design_branch_ci: NEEDS_VERIFICATION
  deferred_test: "Scan -> Recommendation -> Handoff full UI instrumentation test"

work_queue:
  NOW:
    - "Run Android CI against current working branch HEAD."
    - "Complete prototype/reference versus production screen reconciliation."
    - "Validate current APK and update evidence."
    - "Keep project memory synchronized with implementation."
  NEXT:
    - "Cockpit polish/reconciliation."
    - "My Deck/Wallet visual reconciliation."
    - "Catalog provider contract and UI completion."
    - "Offer Engine contract and provider boundary."
    - "Restore deferred end-to-end flow test."
  LATER: ["Insights/Milestones", "Merchant Intelligence Engine", "Additional reward/offer models and safe payment methods"]
  BLOCKED: []
  DEFERRED: ["Full Scan -> Recommendation -> Handoff UI instrumentation until APK/UI validation."]

improvements:
  - {id: IMP-001, area: Design, goal: "Align screens, states, dialogs, bottom-sheets, navigation and motion with approved reference."}
  - {id: IMP-002, area: Engines, goal: "Separate reward/eligibility/offer responsibilities when independent evolution/testing justifies it."}
  - {id: IMP-003, area: Provenance, goal: "Distinguish known facts, user data, calculations, remote data and uncertain/stale data."}
  - {id: IMP-004, area: Testing, goal: "Expand deterministic domain and critical-flow instrumentation coverage."}
  - {id: IMP-005, area: Performance, goal: "Profile startup, recomposition, scanner processing, recommendation rendering and database work."}
  - {id: IMP-006, area: Security, goal: "Review permissions, exported components, logs, backups and sensitive-data boundaries."}
  - {id: IMP-007, area: Accessibility, goal: "Maintain semantics, descriptions, touch targets and font scaling across all screens."}

maintenance:
  meaningful_change_rule: "Update affected feature/engine/screen/work-queue entries with meaningful implementation changes."
  trivial_change_rule: "Pure formatting/mechanical commits do not require semantic memory updates."
  verification_rule: "Never mark VERIFIED without explicit evidence."
  history_rule: "Do not erase superseded decisions; mark them OBSOLETE and record the replacement."
