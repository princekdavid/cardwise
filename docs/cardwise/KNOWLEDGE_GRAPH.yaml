engines:
  principle: "Features describe user capabilities; engines own reusable business decisions/calculations and must remain UI-independent. New engines may be introduced when a responsibility becomes independently testable, reusable or externally evolving."
  - id: ENG-001
    name: QR / Payment Context Resolver
    status: IMPLEMENTED
    responsibility: "Normalize supported QR/UPI input into a safe PaymentContext."
    inputs: [qr_payload]
    outputs: [payment_context, validation_result]
    must:
      - "Treat input as untrusted."
      - "Validate URI shape and required fields."
      - "Keep sensitive credentials out of the model."
    must_not:
      - "Persist raw QR payloads unnecessarily."
      - "Perform payment authorization."
    extension_points: [additional_supported_payment_formats, merchant_context_resolution]
  - id: ENG-002
    name: Reward Engine
    status: IMPLEMENTED_AS_DOMAIN_LOGIC
    responsibility: "Calculate expected reward/benefit from transaction amount, category and applicable reward rules."
    inputs: [payment_context, card, reward_rules]
    outputs: [reward_estimate]
    must:
      - "Be deterministic."
      - "Handle caps/thresholds and invalid numeric values safely."
      - "Expose calculation provenance."
    must_not: [depend_on_compose, mutate_wallet]
    extension_points: [cashback,_points,airmiles,category_multipliers,spend_thresholds]
  - id: ENG-003
    name: Recommendation Engine
    status: IMPLEMENTED
    responsibility: "Evaluate eligible payment options, calculate expected value and deterministically rank candidates."
    inputs: [payment_context, wallet, reward_rules, offers, eligibility_constraints]
    outputs: [ranked_candidates, selected_candidate, benefit_calculation, reasoning]
    pipeline:
      - normalize_context
      - determine_eligibility
      - apply_rules
      - calculate_estimates
      - rank_candidates
      - produce_explanation
    must:
      - "Return deterministic results for identical inputs and rules."
      - "Explain why the selected option won."
      - "Represent uncertainty/caveats instead of claiming guarantees."
    must_not:
      - "Launch payment applications."
      - "Modify wallet state."
      - "Depend on UI state."
    extension_points: [offer_weighting, user_preferences, merchant_rules, travel_value_models, subscription_detection]
  - id: ENG-004
    name: Eligibility Engine
    status: IMPLEMENTED_WITHIN_RECOMMENDATION
    responsibility: "Determine whether a card/reward/offer is applicable to a transaction."
    inputs: [card, payment_context, reward_rule, offer, constraints]
    outputs: [eligibility_result, reason]
    extension_points: [merchant_restrictions,network_restrictions,category_restrictions,spend_limits]
  - id: ENG-005
    name: Offer Engine
    status: PLANNED
    responsibility: "Discover, normalize, filter and rank applicable promotional offers without hard-coding offers into UI."
    inputs: [merchant, payment_context, wallet, offer_catalog, time]
    outputs: [applicable_offers, offer_benefit_estimates, provenance]
    must:
      - "Track expiry and applicability."
      - "Distinguish verified offer facts from estimates."
      - "Remain provider-backed."
    must_not: [hard_code_live_offers_in_compose,claim_guaranteed_savings_without_evidence]
    extension_points: [merchant_offers,issuer_offers,network_offers,partner_offers]
  - id: ENG-006
    name: Merchant Intelligence Engine
    status: PROPOSED
    responsibility: "Resolve/augment merchant identity and context when reliable data is available."
    inputs: [payment_context, merchant_sources]
    outputs: [merchant_context, confidence]
    extension_points: [mcc_mapping,merchant_catalog,local_resolution]
  - id: ENG-007
    name: Insights Engine
    status: PROPOSED
    responsibility: "Aggregate payment/reward history into explainable savings, spend and milestone insights."
    inputs: [transaction_history, reward_history, card_history]
    outputs: [insights, milestones, savings_metrics]
    extension_points: [monthly_summaries,category_trends,benefit_utilization]
  - id: ENG-008
    name: Future Engine Slot
    status: EXTENSION_PATTERN
    responsibility: "New engine may be introduced when a distinct business responsibility needs independent rules, data sources, testing and evolution."
    admission_criteria:
      - "Responsibility is cohesive and reusable."
      - "Logic should not live in UI/ViewModel."
      - "Independent deterministic tests are valuable."
      - "Rules/data are likely to evolve independently."

