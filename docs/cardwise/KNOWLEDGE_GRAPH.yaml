schema_version: 1
project:
  id: CARDWISE
  name: CardWise
  platform: Android
  stack: Kotlin + Jetpack Compose + Material Design
  architecture: Presentation -> ViewModel/UI State -> Domain -> Repository -> Data
  promise: "Before I pay, CardWise tells me the smartest way to pay."
  working_branch: feat/design-system-prototype-integration
  current_head: ce0a81b37c834fbf3d339ffd090179a5a98edba8
  current_ci: "Run #432 is VERIFIED green for parent implementation commit b1788d8b; memory-only sync commit is not independently CI-verified."
  design_plan: docs/cardwise/UI_BACKEND_PLAN.md
  design_source: docs/cardwise/DESIGN_SOURCE.md

status_vocabulary: [DISCOVERED, PLANNED, DESIGNED, IN_PROGRESS, PARTIAL, IMPLEMENTED, VERIFIED, BLOCKED, DEFERRED, REJECTED, OBSOLETE, NEEDS_VERIFICATION]

source_of_truth:
  - {id: CODE, priority: 1, source: "Current repository code and tests"}
  - {id: DESIGN, priority: 2, source: "Latest approved CardWise design/reference artifacts", latest_known: 2026-09-07}
  - {id: DESIGN_RULES, priority: 3, source: "docs/cardwise/DESIGN_SOURCE.md and SCREEN_MATRIX.md"}
  - {id: MEMORY, priority: 4, source: "docs/cardwise/KNOWLEDGE_GRAPH.yaml and AI_CONTEXT.md"}
  - {id: HISTORICAL_DOCS, priority: 5, source: "docs/PRODUCT_SPEC.md, docs/ARCHITECTURE.md, docs/ROADMAP.md, docs/UX_SYSTEM.md, docs/STATUS.md"}
  - {id: CONFLICT_RULE, priority: 0, source: "Never guess when sources conflict; record and resolve the discrepancy."}

constraints:
  - {id: C-001, severity: critical, status: VERIFIED, rule: "Existing APK launcher logo must remain exactly as-is; never redesign, recolor, replace or reinterpret it."}
  - {id: C-002, severity: critical, status: VERIFIED, rule: "Never store UPI PINs, banking passwords, PAN/CVV or equivalent payment credentials."}
  - {id: C-003, severity: critical, status: IMPLEMENTED, rule: "Treat QR contents as untrusted and keep payment payload handling local/ephemeral where practical."}
  - {id: C-004, severity: critical, status: IMPLEMENTED, rule: "External payment handoff requires explicit user confirmation."}
  - {id: C-005, severity: high, status: IMPLEMENTED, rule: "Business rules stay outside Compose UI."}
  - {id: C-006, severity: high, status: IMPLEMENTED, rule: "Recommendation ranking is deterministic and explainable."}
  - {id: C-007, severity: high, status: IN_PROGRESS, rule: "Dynamic card, merchant and offer data must be provider/engine backed; prototype data is not production truth."}
  - {id: C-008, severity: high, status: ACTIVE, rule: "IMPLEMENTED and VERIFIED are separate states and require separate evidence."}

features:
  F-001: {name: Card Wallet, status: VERIFIED, should_do: "Let users add, edit, activate/pause, inspect and remove cards and configured benefits."}
  F-002: {name: Rewards & Benefit Intelligence, status: VERIFIED, should_do: "Represent and calculate rewards/benefits using deterministic rules, categories, caps and thresholds."}
  F-003:
    name: Recommendation
    status: VERIFIED
    should_do: "Given a transaction and eligible payment options, select the best expected value and explain why."
    implementation: "RecommendationEngine remains deterministic and exposes RecommendationEvaluation with a structured RecommendationTrace; RecommendationViewModel carries the trace to the Reasoning UI."
  F-004: {name: QR Scan, status: VERIFIED, should_do: "Scan supported UPI QR codes, parse locally and recover safely from invalid/unsupported/repeated scans."}
  F-005: {name: Scan & Pay, status: VERIFIED, should_do: "Convert a supported scan into a recommendation and safely hand off to an external UPI app after confirmation."}
  F-006: {name: Cockpit, status: IN_PROGRESS, should_do: "Provide premium home surface with payment intelligence, deck status, useful metrics and a fast Scan action."}
  F-007: {name: My Deck / Wallet presentation, status: IN_PROGRESS, should_do: "Present enrolled physical cards as a tactile, manageable deck while preserving Room/repository behavior."}
  F-008: {name: Card Catalog, status: PARTIAL, should_do: "Discover supported cards and add relevant cards to the deck."}
  F-009: {name: Offers, status: PARTIAL, should_do: "Surface active relevant offers and determine whether they apply to cards, merchants and transactions."}
  F-010: {name: Insights / Milestones, status: DESIGNED, should_do: "Explain historical savings, rewards, spend patterns and progress."}
  F-011: {name: Privacy Vault / Settings, status: DESIGNED, should_do: "Give transparency and control over locally stored CardWise data, privacy behavior and reset."}
  F-012: {name: Onboarding, status: DESIGNED, should_do: "Explain product promise/privacy and establish initial setup before Cockpit."}
  F-013: {name: Theme System, status: IMPLEMENTED, should_do: "Provide theme-aware rendering using shared design tokens."}

engines:
  design_rule: "Feature = user capability. Engine = reusable business responsibility. Add/split engines only when cohesive responsibility, independent tests, evolving rules or distinct data providers justify separation."
  registry:
    ENG-001: {name: QR / Payment Context Resolver, status: IMPLEMENTED, should_do: "Normalize supported QR/UPI input into safe PaymentContext."}
    ENG-002: {name: Reward Engine, status: IMPLEMENTED_AS_DOMAIN_LOGIC, should_do: "Calculate expected card reward/benefit deterministically."}
    ENG-003: {name: Recommendation Engine, status: IMPLEMENTED, should_do: "Evaluate eligible options, calculate expected value, rank deterministically and produce reasoning."}
    ENG-004: {name: Eligibility Engine, status: IMPLEMENTED_WITHIN_RECOMMENDATION, should_do: "Determine whether a card/rule/offer/payment method applies and explain ineligibility."}
    ENG-005: {name: Offer Engine, status: PLANNED, should_do: "Discover, normalize, filter and explain applicable promotions without hard-coding offers in UI."}
    ENG-006: {name: Merchant Intelligence Engine, status: PROPOSED, should_do: "Resolve/enrich merchant identity and context when reliable data is available."}
    ENG-007: {name: Insights Engine, status: PROPOSED, should_do: "Aggregate transaction/reward history into explainable savings, spend and milestone insights."}

screens:
  conceptual_reference_set: [ONBOARDING, COCKPIT, SCAN, REASONING, RECOMMENDATION, HANDOFF, WALLET, CATALOG, OFFERS, INSIGHTS, VAULT]
  S-001: {name: Onboarding, status: DESIGNED}
  S-002: {name: Cockpit, status: IN_PROGRESS}
  S-003: {name: QR Scan, status: IMPLEMENTED}
  S-004: {name: Reasoning, status: IN_PROGRESS, implementation_note: "ReasoningScreen consumes deterministic RecommendationTrace and scanned payments now route through Reasoning before Recommendation."}
  S-005: {name: Recommendation, status: VERIFIED}
  S-006: {name: Payment Handoff, status: IMPLEMENTED}
  S-007: {name: Wallet / My Deck, status: IN_PROGRESS}
  S-008: {name: Card Catalog, status: PARTIAL}
  S-009: {name: Offers, status: PARTIAL}
  S-010: {name: Insights / Milestones, status: DESIGNED}
  S-011: {name: Privacy Vault, status: DESIGNED}

flows:
  FLOW-001: {name: Onboarding, path: [ONBOARDING, COCKPIT], status: NEEDS_VERIFICATION}
  FLOW-002: {name: Scan to recommendation to payment, path: [SCAN, REASONING, RECOMMENDATION, HANDOFF, EXTERNAL_UPI_APP, RETURN], status: IN_PROGRESS, known_gap: "Reasoning transition is implemented; full critical-flow instrumentation and APK validation remain."}
  FLOW-003: {name: Wallet management, path: [WALLET, CARD_DETAIL, ADD_EDIT, DELETE], status: VERIFIED}
  FLOW-004: {name: Catalog discovery, path: [WALLET, CATALOG, FILTER, CARD_DETAIL, ADD], status: PARTIAL}
  FLOW-005: {name: Offers discovery, path: [OFFERS, OFFER_DETAIL, CARD_OR_MERCHANT_CONTEXT], status: DESIGNED}
  FLOW-006: {name: Privacy reset, path: [VAULT, RESET_CONFIRMATION, ONBOARDING], status: DESIGNED}

verification:
  historical_milestones: {M0: VERIFIED, M1: VERIFIED, M2: VERIFIED, M3: VERIFIED, M4: VERIFIED, M5: VERIFIED, M6: VERIFIED, M7: PARTIAL}
  last_verified_ci: {commit: b1788d8b013fdc3dc8126fb5c5ef185bd52f1039, run: 34348709814, status: VERIFIED}
  current_implementation_ci: {commit: b1788d8b013fdc3dc8126fb5c5ef185bd52f1039, run: 34348709814, status: VERIFIED}
  reasoning_unit_tests: "RecommendationEngineTest covers matched/no-match trace ordering, deterministic ranking, pending downstream steps and recommendation provenance/why-not reasoning."
  recommendation_instrumentation: "RecommendationScreenTest is CI-verified after stabilizing the animated reward-content assertion."
  deferred_test: "Scan -> Recommendation -> Handoff full UI instrumentation test"

work_queue:
  NOW:
    - "Payment Handoff visual/state reconciliation."
    - "Verify handoff state, external UPI launch/return handling and explicit confirmation behavior against the approved reference."
    - "Add/strengthen focused Handoff unit/instrumentation coverage without destabilizing existing flows."
    - "Keep project memory synchronized with every meaningful implementation commit."
  NEXT:
    - "Card Catalog provider/data contract and UI completion."
    - "Offer Engine contract/provider boundary and Offers UI."
    - "Insights/Milestones history contract and UI."
    - "Privacy Vault and onboarding/privacy oath."
  LATER: ["Merchant Intelligence Engine", "Additional reward/offer models", "Additional safe payment methods", "Release visual regression depth"]
  BLOCKED: []
  DEFERRED: ["Full Scan -> Recommendation -> Handoff UI instrumentation until UI reconciliation is complete."]

maintenance:
  meaningful_change_rule: "Update affected feature/engine/screen/work-queue entries with meaningful implementation changes."
  trivial_change_rule: "Pure formatting/mechanical commits do not require semantic memory updates."
  verification_rule: "Never mark VERIFIED without explicit evidence."
  history_rule: "Do not erase superseded decisions; mark them OBSOLETE and record the replacement."
