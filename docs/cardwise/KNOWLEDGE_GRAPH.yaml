schema_version: 1
project:
  id: CARDWISE
  name: CardWise
  platform: Android
  language: Kotlin
  ui: Jetpack Compose
  design_system: Material Design
  architecture: Presentation -> ViewModel/UI State -> Domain -> Repository -> Data
  promise: "Before I pay, CardWise tells me the smartest way to pay."
  status: DESIGN_INTEGRATION_AND_BETA_HARDENING
  current_branch: feat/design-system-prototype-integration
  current_head: 1aa3343eca479be70be04e579b563e1bb6b3cb54
  current_head_note: "HEAD recorded before creation of this memory document; subsequent docs commits advance the branch and must update this field."

status_vocabulary:
  DISCOVERED: "Known from source material but not yet planned/implemented."
  PLANNED: "Explicitly intended but implementation has not started."
  DESIGNED: "Design/reference exists; production implementation may not exist."
  IN_PROGRESS: "Active implementation is underway."
  PARTIAL: "Some required behavior exists but the complete contract is not satisfied."
  IMPLEMENTED: "Required production behavior is present in code."
  VERIFIED: "Implemented and verified by the required test/review/CI evidence."
  BLOCKED: "Cannot proceed until a dependency or decision is resolved."
  DEFERRED: "Intentionally postponed."
  REJECTED: "Explicitly not part of the product direction."
  OBSOLETE: "Historical state/decision superseded by a newer one."
  NEEDS_VERIFICATION: "Evidence is insufficient; never infer completion."

source_of_truth:
  - id: SRC-CODE
    type: repository_code_and_tests
    priority: 1
    reference: "princekdavid/cardwise"
  - id: SRC-PROTOTYPE
    type: supplied_design_artifact
    priority: 2
    reference: "CardWise Interactive Experience Prototype.html"
    latest_known: 2026-09-07
  - id: SRC-COMPOSE-REFERENCE
    type: supplied_design_artifact
    priority: 2
    reference: "CardWise Jetpack Compose Android Application.kt.txt"
    latest_known: 2026-09-07
  - id: SRC-KNOWLEDGE
    type: repository_project_memory
    priority: 3
    reference: "docs/cardwise/KNOWLEDGE_GRAPH.yaml"
  - id: SRC-DOCS
    type: repository_docs
    priority: 4
    reference: "docs/PRODUCT_SPEC.md, docs/ARCHITECTURE.md, docs/ROADMAP.md, docs/STATUS.md, docs/UX_SYSTEM.md"

protected_constraints:
  - id: C-001
    rule: "Existing APK launcher logo must remain exactly as-is."
    status: VERIFIED
    severity: critical
  - id: C-002
    rule: "Never store UPI PINs, banking passwords, PAN/CVV or equivalent payment credentials."
    status: VERIFIED
    severity: critical
  - id: C-003
    rule: "QR payloads are untrusted input and should be processed locally where practical."
    status: IMPLEMENTED
    severity: critical
  - id: C-004
    rule: "External payment handoff requires explicit user action."
    status: IMPLEMENTED
    severity: critical
  - id: C-005
    rule: "Business rules stay outside Compose UI."
    status: IMPLEMENTED
    severity: critical
  - id: C-006
    rule: "Recommendation ranking is deterministic and explainable."
    status: IMPLEMENTED
    severity: critical
  - id: C-007
    rule: "Dynamic card, offer and merchant data must be engine/provider backed; prototype data is not production truth."
    status: IN_PROGRESS
    severity: high
  - id: C-008
    rule: "IMPLEMENTED is not equivalent to VERIFIED; evidence must be recorded separately."
    status: VERIFIED
    severity: high

