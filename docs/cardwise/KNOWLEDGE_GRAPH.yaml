maintenance:
  update_rule: "For every meaningful feature/refactor/architecture change, update the affected graph entry and current-state documents in the same commit when practical."
  trivial_commit_rule: "Formatting or mechanical commits need not rewrite semantic project memory."
  verification_rule: "Never mark VERIFIED without explicit evidence: relevant tests, APK/manual validation, CI or another recorded verification method."
  history_rule: "Do not erase historical decisions; mark superseded items OBSOLETE and record the replacement decision/commit."
